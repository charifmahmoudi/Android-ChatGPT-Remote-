name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests, lint, and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk android-chatgpt-remote-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-chatgpt-remote-debug-apk
          path: android-chatgpt-remote-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
